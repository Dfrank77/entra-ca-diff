[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-ca-diff"
version = "0.3.0"
description = "Flag Entra ID Conditional Access policy changes that reduce coverage or enforcement."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Darius Frank" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
entra-ca-diff = "entra_ca_diff.cli:main"

[project.urls]
Homepage = "https://github.com/Dfrank77/entra-ca-diff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
